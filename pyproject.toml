[project]
name = "fashion-trend-intelligence"
version = "0.1.0"
description = "Fashion Trend Intelligence Pipeline for Iranian Market — MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "tenacity>=8.2",
    "trafilatura>=1.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "python-dateutil>=2.8",
    "dateparser>=1.2",
    "langdetect>=1.0",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "jdatetime>=4.1",
    "python-multipart>=0.0.9",
    "protego>=0.2",
    "sentence-transformers>=2.5; extra == 'embeddings'",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.5", "torch>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pytest-httpx>=0.21"]
all = ["fashion-trend-intelligence[embeddings,dev]"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
