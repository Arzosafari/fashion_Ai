[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-stt"
version = "1.0.0"
description = "Real-time English Speech-to-Text Module for Fashion Applications"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "vosk>=0.3.45",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "gTTS>=2.5.0"
]

[project.scripts]
fashion-stt = "fashion_stt.cli:main"
