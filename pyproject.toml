[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-stt"
version = "2.1.0"
description = "Fashion AI Voice & Text Request Understanding and Weather Context Integration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "vosk>=0.3.45",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "gTTS>=2.5.0",
    "requests>=2.31.0",
    "httpx>=0.27.0"
]

[project.scripts]
fashion-stt = "fashion_stt.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

