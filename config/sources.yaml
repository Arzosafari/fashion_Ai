    enabled: true
    robots_status: "disallow_all_for_star"
    sitemap_url: "https://www.wgsn.com/sitemap.xml"
    rss_url: null
    notes: "Professional forecasting; robots.txt blocks * (Disallow: /) except allowlisted bots. System must gracefully skip 403/paywall — do NOT bypass. Authority high when legally retrievable."

