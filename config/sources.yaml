# Global trend sources — 4 enabled (Vogue, Harper's Bazaar, Who What Wear, WGSN)
# Iranian sources removed per global migration (trend_scope=global)
# All weights configurable; authority_weight influences G.
# See IRANIAN_NETWORK_DIAGNOSIS_REPORT.md for removed Iranian sources archive.
sources:
  - source_id: vogue
    name: "Vogue"
    source_type: editorial
    country: US
    region: global
    scope: global
    language: en
    authority_weight: 0.95
    freshness_weight: 0.85
    accessibility: public
    extraction_method: sitemap_rss
    update_frequency: "6h"
    priority: high
    enabled: true
    robots_status: "allowed_articles"
    sitemap_url: "https://www.vogue.com/sitemap.xml"
    rss_url: "https://www.vogue.com/feed/rss"
    selectors_need_verification: false

  - source_id: harpers_bazaar
    name: "Harper's Bazaar"
    source_type: editorial
    country: US
    region: global
    scope: global
    language: en
    authority_weight: 0.90
    freshness_weight: 0.80
    accessibility: public
    extraction_method: sitemap
    update_frequency: "6h"
    priority: high
    enabled: true
    robots_status: "allowed_articles"
    sitemap_url: "https://www.harpersbazaar.com/sitemap_index.xml"
    rss_url: null
    notes: "Verified 2026-09-29: robots allows *, sitemap_index with brand-tag/people-tag/content-tag including fashion week/trend reports"

  - source_id: whowhatwear
